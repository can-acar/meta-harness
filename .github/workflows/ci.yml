name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  denetim:
    name: Test ve clippy (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Birim testleri
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Statik mh derlemesi
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release -p mh --target x86_64-unknown-linux-gnu

  capraz:
    name: Derleme denetimi (${{ matrix.hedef }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hedef: [x86_64-pc-windows-gnu, x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.hedef }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.hedef }}
      # Ana makine tarafı (VMM + başlatıcı) her platformda derlenmeli; mh yalnızca Linux misafiri içindir.
      - name: Clippy
        run: cargo clippy --locked -p metahernes -p metahernes-vmm --all-targets --target ${{ matrix.hedef }} -- -D warnings
