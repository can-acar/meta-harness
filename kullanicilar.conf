# metahernes kullanıcıları — build.sh imaja işler. Açılıştan sonra: mh-kullanici
# tip    ad            ek
# insan  <ad>          [--yonetici]   (keys/<ad>.pub varsa SSH anahtarı olarak eklenir)
# ajan   <ad>          <rol> [araç]   (rol: gelistirici | inceleyici | operasyon; araç: claude | codex | agy)
#   Her ajan ayrı Linux hesabı ve ayrı kimliktir: aynı araçtan farklı hesaplarla birden çok ajan açılabilir.
#   codex/agy için build.sh'ta MH_ARACLAR=claude,codex,agy verin. Kimlik: mh-ajan <ad> giris | sudo mh-anahtar --ajan <ad>
insan    can           --yonetici
ajan     gelistirici   gelistirici
ajan     inceleyici    inceleyici
ajan     operasyon     operasyon
# Örnekler:
# ajan   codex-1       gelistirici    codex
# ajan   codex-2       gelistirici    codex
# ajan   agy-1         inceleyici     agy
